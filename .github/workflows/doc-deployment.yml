name: Build Manuals and Deploy

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: write

env:
  LANG: en_US.UTF-8
  LC_ALL: en_US.UTF-8
  PIP_DISABLE_PIP_VERSION_CHECK: "ON"
  PIP_PREFER_BINARY: "ON"
  TZ: UTC
  PYTHONUNBUFFERED: "1" #to immediately see full logs

jobs:
  build-manual:

    defaults:
      run:
        shell: bash

    strategy:
      matrix:
        include:
          - manual: HPBLUP
            repo: mirjamspd/HPBLUP
            cname: manual.hpblup.eu

          - manual: MiXBLUP
            repo: mirjamspd/MiXBLUP
            cname: manual.mixblup.eu

    runs-on: ubuntu-24.04

    steps:
      #1. Checkout repository
      - name: Checkout repository
        uses: actions/checkout@v6

      #2. Install Fortran compiler and Pandoc
      - name: Install system packages
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            gfortran \
            pandoc \
            texlive-luatex \
            texlive-latex-base \
            texlive-latex-extra \
            texlive-fonts-recommended \
            fonts-lmodern
      
      # Diagnostic: check LaTeX environment
      - name: Check LaTeX environment
        run: |
          pandoc --version
          lualatex --version
          kpsewhich latex-lab-testphase-block.sty

      # Clean previous generated files
      - name: Clean previous generated files
        run: |
          rm -rf site
          rm -f docs/index.md

      #3. Compile the manual extractor
      - name: Compile ExtractManual
        run: |
          gfortran -ffree-line-length-none ExtractManual/ExtractManual.f90 \
                   -o ExtractManual/ExtractManual

      - name: Update title page date
        run: |
          YEAR=$(date -u +'%Y')
          MONTH=$(date -u +'%m')
          sed -i "s/{{year}}/${YEAR}/g; s/{{month}}/${MONTH}/g" TitlePage.md

      #4. Generate the markdown manual(s)
      - name: Generate Manuals
        run: |
          ./ExtractManual/ExtractManual -f Chapters.txt
      
      #5. Compile the chapter extractor
      - name: Compile MakeChapters
        run: |
          gfortran -ffree-line-length-none MakeChapters/MakeChapters.f90 \
                   -o MakeChapters/MakeChapters

      #6. Make chapters
      - name: Make Chapters
        run: |
          ./MakeChapters/MakeChapters -f "ExtractedManuals/Manual${{ matrix.manual }}.md"

      #7. Compile the UpdateCrossReference
      - name: Compile UpdateCrossReference
        run: |
          gfortran -ffree-line-length-none UpdateCrossReference/UpdateCrossReference.f90 \
                   -o UpdateCrossReference/UpdateCrossReference

      #8. Update Cross References
      - name: Update Cross References 
        run: |
          ./UpdateCrossReference/UpdateCrossReference -f "ExtractedManuals/Manual${{ matrix.manual }}_2.md"

      #9. Find the newest generated markdown file
      - name: Find latest Manual${{ matrix.manual }} manual
        id: manual
        run: |
          echo "Available manuals:"
          ls -lt ExtractedManuals/Manual${{ matrix.manual }}*.md
          FILE=$(ls -t ExtractedManuals/Manual${{ matrix.manual }}*.md | head -n1)
          echo "file=$FILE" >> "$GITHUB_OUTPUT"
          echo "Using $FILE"
      
      #10. Create PDF from the latest .md file (#refers to $GITHUB_OUTPUT)
      - name: Build PDF
        run: |
          pandoc \
            -V pdfstandard=ua-2 \
            --pdf-engine=lualatex \
            --lua-filter lua/pagebreak.lua \
            "${{ steps.manual.outputs.file }}" \
            -o ExtractedManuals/Manual${{ matrix.manual }}.pdf

      - name: Upload generated ${{ matrix.manual }} manuals
        uses: actions/upload-artifact@v6
        with:
          name: manual-${{ matrix.manual }}
          path: |
            ExtractedManuals/Manual${{ matrix.manual }}*.md
            ExtractedManuals/Manual${{ matrix.manual }}.pdf

      #12. Set up Python
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      #13. Install MkDocs
      - name: Install Python packages
        run: |
          pip install mkdocs
          pip install mkdocs-material

      #14. Clean manual
      - name: Clean manual
        run: |
          python docs/clean.py "${{ steps.manual.outputs.file }}"

      - name: Check cleaned manual
        run: |
          echo "Building ${{ matrix.manual }}"
          head -30 docs/manual_cleaned.md
          
      #15. Make manual the homepage
      - name: Prepare homepage
        run: |
          cp docs/manual_cleaned.md docs/index.md
      
      - name: Check homepage copy
        run: |
          echo "Building ${{ matrix.manual }}"
          echo "index.md:"
          head -30 docs/index.md

      #16. Build website
      - name: Build website
        run: |
          rm -rf site

          if [ "${{ matrix.manual }}" = "HPBLUP" ]; then
            echo "manual.hpblup.eu" > docs/CNAME
            mkdocs build -f mkdocs-hpblup.yml
          else
            echo "manual.mixblup.eu" > docs/CNAME
            mkdocs build -f mkdocs-mixblup.yml
          fi

      #16. Deploy website to repository
      - name: Deploy ${{ matrix.manual }}
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: peaceiris/actions-gh-pages@v4
        with:
          personal_token: ${{ secrets.PAGES_TOKEN }}
          external_repository: ${{ matrix.repo }}
          publish_dir: ./site
          publish_branch: main
          force_orphan: true

  save-generated-manuals:
    needs: build-manual
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          ref: ${{ github.ref_name }}

      - name: Download generated manuals
        uses: actions/download-artifact@v7
        with:
          pattern: manual-*
          path: ExtractedManuals
          merge-multiple: true

      - name: Commit generated manuals
        run: |
          VERSION=$(sed -n 's/^\*\*Version \(.*\)\*\*$/\1/p' ExtractedManuals/ManualMiXBLUP.md | head -n1)

          git config user.name "github-actions"
          git config user.email "github-actions@github.com"

          git add ExtractedManuals/

          if git diff --cached --quiet; then
            echo "No changes"
          else
            git commit -m "Newly extracted manuals build ${VERSION}"
            git push
          fi
